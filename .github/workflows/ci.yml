name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Record checkout and runtime identity
        run: |
          git rev-parse HEAD
          python -VV
          python -m pip --version
          echo "event=${{ github.event_name }} run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }} workflow_sha=${{ github.workflow_sha }}"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: pytest --version
      - run: python -c "import importlib.metadata as m; [print(f'{name}={m.version(name)}') for name in ('pytest-cov','pytest-asyncio','pytest-xdist')]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=worktree_import_guard --cov-report=term-missing
      - run: python -m build
      - name: Record distribution identities
        run: |
          python -c "from pathlib import Path; import hashlib; files=[*Path('dist').glob('*.whl'), *Path('dist').glob('*.tar.gz')]; [print(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}  {p.stat().st_size} bytes') for p in sorted(files)]" | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            pytest: "pytest==8.2.0"
          - os: ubuntu-latest
            python: "3.11"
            pytest: "pytest<10"
          - os: ubuntu-latest
            python: "3.12"
            pytest: "pytest<10"
          - os: ubuntu-latest
            python: "3.13"
            pytest: "pytest<10"
          - os: windows-latest
            python: "3.13"
            pytest: "pytest<10"
          - os: macos-latest
            python: "3.13"
            pytest: "pytest<10"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Record checkout and runtime identity
        run: |
          git rev-parse HEAD
          python -VV
          echo "event=${{ github.event_name }} run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }} workflow_sha=${{ github.workflow_sha }}"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]" "${{ matrix.pytest }}"
      - run: pytest --version
      - run: python -c "import importlib.metadata as m; [print(f'{name}={m.version(name)}') for name in ('pytest-cov','pytest-asyncio','pytest-xdist')]"
      - run: pytest

  artifact:
    name: Installed candidate / ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - run: python -m pip install --disable-pip-version-check pytest build twine pyyaml
      - name: Exact wheel, sdist, README shell commands and Hero Demo
        run: python docs/releasing/check_candidate.py --dist dist --output "${{ runner.temp }}/b1-candidate-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/b1-candidate-check/*.log
            ${{ runner.temp }}/b1-candidate-check/*.json
            ${{ runner.temp }}/b1-candidate-check/*.xml
          if-no-files-found: error
