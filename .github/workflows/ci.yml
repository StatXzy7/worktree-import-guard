name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Record checkout and runtime identity
        run: |
          git rev-parse HEAD
          python -VV
          python -m pip --version
          echo "event=${{ github.event_name }} run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }} workflow_sha=${{ github.workflow_sha }}"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: pytest --version
      - run: python -c "import importlib.metadata as m; [print(f'{name}={m.version(name)}') for name in ('pytest-cov','pytest-asyncio','pytest-xdist')]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=worktree_import_guard --cov-report=term-missing
      - run: python -m build
      - name: Record distribution identities
        run: |
          python -c "from pathlib import Path; import hashlib; files=[*Path('dist').glob('*.whl'), *Path('dist').glob('*.tar.gz')]; [print(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}  {p.stat().st_size} bytes') for p in sorted(files)]" | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            pytest: "pytest==8.2.0"
          - os: ubuntu-latest
            python: "3.11"
            pytest: "pytest<10"
          - os: ubuntu-latest
            python: "3.12"
            pytest: "pytest<10"
          - os: ubuntu-latest
            python: "3.13"
            pytest: "pytest<10"
          - os: windows-latest
            python: "3.13"
            pytest: "pytest<10"
          - os: macos-latest
            python: "3.13"
            pytest: "pytest<10"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Record checkout and runtime identity
        run: |
          git rev-parse HEAD
          python -VV
          echo "event=${{ github.event_name }} run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }} workflow_sha=${{ github.workflow_sha }}"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]" "${{ matrix.pytest }}"
      - run: pytest --version
      - run: python -c "import importlib.metadata as m; [print(f'{name}={m.version(name)}') for name in ('pytest-cov','pytest-asyncio','pytest-xdist')]"
      - run: pytest

  artifact:
    name: Installed wheel, sdist, and worktrees
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Record checkout and runtime identity
        run: |
          git rev-parse HEAD
          python -VV
          echo "event=${{ github.event_name }} run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }} workflow_sha=${{ github.workflow_sha }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - run: python -m pip install --disable-pip-version-check pytest build
      - run: pytest --version
      - name: Select the tested wheel
        run: echo "WTIG_ARTIFACT_WHEEL=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - name: Install sdist outside the repository
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-smoke"
          python -m pip wheel --wheel-dir "${RUNNER_TEMP}/sdist-wheel" dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip install "${RUNNER_TEMP}"/sdist-wheel/worktree_import_guard-*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/sdist-smoke/bin/wt-import" --help
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip list --format=freeze
          sha256sum "${RUNNER_TEMP}"/sdist-wheel/worktree_import_guard-*.whl
      - name: Verify installed wheel console scripts and editable worktrees
        env:
          WTIG_RUN_ARTIFACT_TESTS: "1"
        run: |
          pytest tests/artifact -q -rA --junitxml=artifact-junit.xml
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('artifact-junit.xml').getroot(); suites=[r] if r.tag == 'testsuite' else list(r); passed=sum(int(s.attrib.get('tests','0'))-int(s.attrib.get('failures','0'))-int(s.attrib.get('errors','0'))-int(s.attrib.get('skipped','0')) for s in suites); assert passed >= 1, 'artifact tests did not execute and pass'"
      - name: Hero Demo using the downloaded wheel
        run: python examples/cross-worktree-demo/run.py --wheel "$WTIG_ARTIFACT_WHEEL"
