[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "worktree-import-guard"
version = "0.1.0"
description = "Catch Python tests that pass against the wrong Git worktree."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "worktree-import-guard contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pytest",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=8.2,<10"]

[project.urls]
Homepage = "https://github.com/StatXzy7/worktree-import-guard"
Repository = "https://github.com/StatXzy7/worktree-import-guard"
Issues = "https://github.com/StatXzy7/worktree-import-guard/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest-asyncio>=0.23,<1.4",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
]

[project.scripts]
wt-import = "worktree_import_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worktree_import_guard"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks",
  "/docs",
  "/examples",
  "/AGENTS.md",
  "/README.md",
  "/README.zh-CN.md",
  "/SECURITY.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "artifact: builds and installs distributions in a clean virtual environment",
  "compat: exercises a small supported-plugin compatibility surface",
  "integration: exercises the CLI in subprocesses",
]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["worktree_import_guard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
